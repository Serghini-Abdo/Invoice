name: CI

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  domain:
    name: Domain unit tests (JVM only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p domain test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domain-test-reports
          path: domain/build/reports/tests

  android:
    name: Android build, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build, test, lint
        shell: bash # GitHub's "bash" shell enables pipefail, so a Gradle failure is not hidden by tee
        run: |
          ./gradlew :domain:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --continue --console=plain 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Debug APK must be signed with the pinned key (the Drive OAuth client matches this SHA-1)
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          sha1=$(grep -m1 "certificate SHA-1 digest" certs.txt | sed 's/.*: //')
          echo "APK signing certificate SHA-1 (no colons): $sha1"
          expected=$(grep -m1 -oE '([0-9A-F]{2}:){19}[0-9A-F]{2}' docs/google-drive-setup.md | tr -d ':' | tr 'A-F' 'a-f')
          echo "SHA-1 documented in docs/google-drive-setup.md:  $expected"
          test -n "$sha1" && test "$sha1" = "$expected"
      - name: Room schema must match the committed baseline
        # The build regenerates app/schemas/**/N.json from the entities. If it differs from what is committed,
        # an entity changed without a new schema version / committed schema (migrations would silently break).
        run: |
          git status --short app/schemas
          git diff --stat -- app/schemas
          git diff -- app/schemas | head -60
          git diff --quiet -- app/schemas
      - name: Failure summary
        if: failure()
        run: |
          echo "=============== COMPILER ERRORS ==============="
          grep -E "^e: " build.log | sed 's#file:///home/runner/work/Invoice/Invoice/##' | sort -u | head -80 || true
          echo "=============== FAILED TASKS / TESTS ==============="
          grep -E "FAILED|Execution failed for task" build.log | sort -u | head -30 || true
          echo "=============== LINT ==============="
          grep -E "Error:|error:" build.log | head -20 || true
          if [ -f app/build/reports/lint-results-debug.txt ]; then head -80 app/build/reports/lint-results-debug.txt; fi

  instrumented:
    # API 24 is the oldest Android the app supports (it caught java.time and BigInteger gaps that the JVM
    # tests cannot see); API 34 is a current phone.
    name: Emulator tests (Android API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]
    permissions:
      contents: write # only used to publish screenshots to the throwaway ci-screenshots branch
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
      - name: Instrumented test summary
        if: always()
        run: |
          echo "=============== INSTRUMENTED TEST RESULTS ==============="
          # result file names contain spaces ("TEST-emulator-5554 - 11_app-.xml"), so read them NUL-delimited
          find app/build/outputs/androidTest-results -name "*.xml" -print0 2>/dev/null | while IFS= read -r -d '' f; do
            echo "--- $f"
            grep -o '<testsuite [^>]*' "$f" | sed 's/xmlns[^ ]*//' | head -3
            grep -B1 -A6 "<failure" "$f" | cut -c1-1800 | head -120
            grep -B1 -A6 "<error" "$f" | cut -c1-1800 | head -40
          done
          echo "--- crash details from per-test logcat files (only files that contain a crash)"
          find app/build/outputs/androidTest-results -type f -name "logcat*" -print0 2>/dev/null | while IFS= read -r -d '' f; do
            if grep -q -E "FATAL EXCEPTION|ANR in" "$f"; then
              echo "--- $f"
              grep -m1 -B2 -A25 -E "FATAL EXCEPTION|ANR in" "$f" | cut -c1-300
            fi
          done
          echo "=============== END ==============="
      - name: Publish screenshots (branch ci-screenshots, overwritten on every run)
        if: always() && github.event_name != 'pull_request' && matrix.api == 34
        run: |
          out=app/build/outputs/connected_android_test_additional_output
          if [ -d "$out" ]; then
            rm -rf /tmp/shots && mkdir /tmp/shots
            find "$out" -type f \( -name '*.png' -o -name '*.jpg' \) -exec cp {} /tmp/shots/ \;
            ls -la /tmp/shots
            cd /tmp/shots
            git init -q -b ci-screenshots
            git add -A
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "screenshots for ${{ github.sha }}"
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
          else
            echo "no additional test output found"
          fi
